<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AK CRM – نظام إدارة العقارات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#0f2557;--primary-light:#1a3a7c;--accent:#00c2cb;--accent-soft:#00c2cb22;
  --bg:#f0f4f8;--surface:#fff;--surface2:#f8fafc;--border:#e2e8f0;
  --text:#0f172a;--text-muted:#64748b;--text-light:#94a3b8;
  --success:#10b981;--warning:#f59e0b;--danger:#ef4444;--info:#3b82f6;
  --sidebar-w:260px;--shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.04);
  --shadow-lg:0 8px 32px rgba(15,37,87,.12);--radius:12px;--radius-sm:8px
}
.dark{
  --primary:#1e3a8a;--primary-light:#2563eb;--bg:#0f172a;--surface:#1e293b;
  --surface2:#263346;--border:#334155;--text:#f1f5f9;--text-muted:#94a3b8;
  --text-light:#64748b;--shadow:0 1px 3px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.2);
  --shadow-lg:0 8px 32px rgba(0,0,0,.4)
}
body{font-family:'Tajawal',sans-serif;direction:rtl;background:var(--bg);color:var(--text);transition:background .3s,color .3s}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.app-layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);min-height:100vh;background:var(--primary);display:flex;flex-direction:column;position:fixed;right:0;top:0;bottom:0;z-index:100;overflow-y:auto;box-shadow:-4px 0 24px rgba(0,0,0,.15)}
.sidebar-logo{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:12px}
.logo-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#0099a8);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;box-shadow:0 4px 12px rgba(0,194,203,.3);flex-shrink:0}
.logo-text h2{font-size:18px;font-weight:800;color:#fff}.logo-text p{font-size:11px;color:rgba(255,255,255,.5);margin-top:2px}
.sidebar-nav{padding:12px 0;flex:1}
.nav-section{padding:8px 16px 4px;font-size:10px;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;margin:2px 10px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.7);transition:all .2s;position:relative;border:none;background:none;width:calc(100% - 20px);text-align:right;font-family:'Tajawal',sans-serif}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(0,194,203,.3)}
.nav-item .icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nav-badge{background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;margin-right:auto}
.sidebar-user{padding:16px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.user-av{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#0099a8);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.main-content{margin-right:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.topbar-title{font-size:18px;font-weight:700;color:var(--text)}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all .2s;color:var(--text-muted)}
.icon-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.page-content{padding:24px;flex:1}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);transition:box-shadow .2s}
.card:hover{box-shadow:var(--shadow-lg)}
.card-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card-title{font-size:15px;font-weight:700;color:var(--text)}
.card-body{padding:20px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.kpi-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kpi-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--kc,var(--accent))}
.kpi-icon{width:48px;height:48px;border-radius:12px;background:var(--kb,var(--accent-soft));display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px}
.kpi-value{font-size:28px;font-weight:800;color:var(--text);line-height:1}
.kpi-label{font-size:13px;color:var(--text-muted);margin-top:4px;font-weight:500}
.kpi-change{font-size:12px;font-weight:600;margin-top:8px}
.kpi-change.up{color:var(--success)}.kpi-change.down{color:var(--danger)}
.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px}
.table-container{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--surface2);padding:11px 14px;text-align:right;font-size:12px;font-weight:700;color:var(--text-muted);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 14px;font-size:13px;color:var(--text);border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:'Tajawal',sans-serif;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-light);box-shadow:0 4px 12px rgba(15,37,87,.3)}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:#00aab2}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}.btn-outline:hover{background:var(--surface2)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#dc2626}
.btn-sm{padding:6px 12px;font-size:12px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.form-control{width:100%;padding:10px 14px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13.5px;color:var(--text);font-family:'Tajawal',sans-serif;transition:border-color .2s,box-shadow .2s;outline:none}
.form-control:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.form-control::placeholder{color:var(--text-light)}
.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.form-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.col-span-2{grid-column:span 2}.col-span-3{grid-column:span 3}
.filters-bar{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:16px;box-shadow:var(--shadow);flex-wrap:wrap}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:8px 14px;flex:1;min-width:200px}
.search-box input{background:none;border:none;outline:none;font-size:13px;color:var(--text);font-family:'Tajawal',sans-serif;width:100%}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:20px}
.modal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);width:100%;max-width:800px;max-height:90vh;overflow-y:auto;border:1px solid var(--border)}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-title{font-size:17px;font-weight:700;color:var(--text)}
.modal-body{padding:24px}.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px}
.activity-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.activity-item:last-child{border-bottom:none}
.activity-icon{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.donut-container{display:flex;align-items:center;gap:20px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.chart-bar-item{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:10px}
.chart-bar-label{width:120px;color:var(--text-muted);text-align:right;flex-shrink:0}
.chart-bar-track{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.chart-bar-fill{height:100%;border-radius:4px}
.chart-bar-value{width:60px;color:var(--text);font-weight:600;font-size:12px}
.tabs{display:flex;gap:4px;background:var(--surface2);border-radius:var(--radius-sm);padding:4px;border:1px solid var(--border);margin-bottom:20px}
.tab{flex:1;padding:9px 14px;border-radius:6px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;text-align:center;transition:all .2s;font-family:'Tajawal',sans-serif;border:none;background:none}
.tab.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
.dark .tab.active{color:var(--accent)}
.notif-dot{width:8px;height:8px;background:var(--danger);border-radius:50%;position:absolute;top:6px;left:6px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.stat-row:last-child{border-bottom:none}
.stat-row-label{font-size:13px;color:var(--text-muted)}.stat-row-value{font-size:14px;font-weight:700;color:var(--text)}
.alert{padding:12px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.alert-danger{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f2557 0%,#1a3a7c 50%,#0f2557 100%);padding:20px}
.login-card{background:#fff;border-radius:20px;padding:48px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.dark .login-card{background:#1e293b}
.login-logo-icon{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#00c2cb,#0099a8);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff;margin:0 auto 16px;box-shadow:0 8px 24px rgba(0,194,203,.3)}
.empty-state{text-align:center;padding:48px 20px;color:var(--text-muted)}
@media(max-width:1024px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.dash-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.sidebar{transform:translateX(100%);transition:transform .3s}.sidebar.open{transform:translateX(0)}.main-content{margin-right:0}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef} = React;

const USERS_KEY = 'ak_crm_users';
const DATA_KEY = 'ak_crm_data';
const USAGE_KEY = 'ak_crm_usage';

const DEFAULT_USERS = [
  {id:1,username:"admin",password:"admin123",name:"مدير النظام",role:"general_manager",avatar:"مد",phone:"",permissions:{add:true,edit:true,delete:true,print:true,export:true,viewPhones:true,manageFollowups:true,manageUsers:true}},
];

const DEFAULT_DATA = {
  regions:["الرياض - حي النرجس","الرياض - حي الملقا","الرياض - حي العارض","الرياض - حي الياسمين","جدة - حي الشاطئ","جدة - حي الزهراء","الدمام - حي الفيصلية"],
  lands:[],
  apartments:[],
  clients:[],
  activities:[]
};

const roleLabels={general_manager:"المدير العام",sales_manager:"مدير المبيعات",sales:"سيلز",data_entry:"مدخل بيانات"};
const statusColors={"متاحة":"#10b981","محجوزة":"#f59e0b","تم البيع":"#3b82f6","موقوفة":"#ef4444","جديد":"#6366f1","جاري التواصل":"#f59e0b","مهتم":"#10b981","تفاوض":"#8b5cf6","تم الحجز":"#3b82f6","غير مهتم":"#6b7280"};

function saveUsers(u){try{localStorage.setItem(USERS_KEY,JSON.stringify(u))}catch(e){}}
function loadUsers(){try{const s=localStorage.getItem(USERS_KEY);return s?JSON.parse(s):DEFAULT_USERS}catch(e){return DEFAULT_USERS}}
function saveData(d){try{localStorage.setItem(DATA_KEY,JSON.stringify(d))}catch(e){}}
function loadData(){try{const s=localStorage.getItem(DATA_KEY);return s?JSON.parse(s):DEFAULT_DATA}catch(e){return DEFAULT_DATA}}
function saveUsage(u){try{localStorage.setItem(USAGE_KEY,JSON.stringify(u))}catch(e){}}
function loadUsage(){try{const s=localStorage.getItem(USAGE_KEY);return s?JSON.parse(s):{}}catch(e){return {}}}

// ---- date/time helpers ----
function daysSince(dateStr){if(!dateStr)return 0;const d=new Date(dateStr);if(isNaN(d))return 0;return Math.floor((Date.now()-d.getTime())/86400000);}
function hoursSince(dateStr){if(!dateStr)return 0;const d=new Date(dateStr);if(isNaN(d))return 0;return (Date.now()-d.getTime())/3600000;}
function isRecordStale(item){return daysSince(item.lastConfirmedAt||item.createdAt)>=30;}
function isFreshExpired(client){return client.status==="جديد"&&hoursSince(client.assignedAt||client.createdAt)>=24;}
function formatDuration(totalSeconds){
  const s=Math.max(0,Math.floor(totalSeconds||0));
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(h>0)return `${h}س ${m}د`;
  if(m>0)return `${m}د ${sec}ث`;
  return `${sec}ث`;
}
// returns the visible name/phone for a record depending on ownership and manager status
function ownerView(item,currentUser,isManager,nameKey,phoneKey){
  const mine=item.salesId===currentUser.id;
  const full=isManager||mine;
  return {
    name: full?(item[nameKey]||"-"):"🔒 محجوب",
    phone: full?(item[phoneKey]||"-"):"🔒 محجوب",
    full
  };
}

const Badge=({status,small})=>{
  const color=statusColors[status]||"#6b7280";
  return React.createElement('span',{className:"badge",style:{background:color+"20",color,fontSize:small?"11px":undefined}},
    React.createElement('span',{className:"badge-dot",style:{background:color}}),status);
};

const DonutChart=({data,size=120})=>{
  const total=data.reduce((s,d)=>s+d.value,0);
  let offset=0;
  const r=45,cx=60,cy=60,circ=2*Math.PI*r;
  return React.createElement('div',{className:"donut-container"},
    React.createElement('svg',{width:size,height:size,viewBox:"0 0 120 120",style:{transform:"rotate(-90deg)"}},
      React.createElement('circle',{cx,cy,r,fill:"none",stroke:"var(--border)",strokeWidth:14}),
      ...data.map((d,i)=>{
        const pct=total?d.value/total:0;
        const dash=circ*pct;
        const offPx=-(offset/total)*circ;
        const el=React.createElement('circle',{key:i,cx,cy,r,fill:"none",stroke:d.color,strokeWidth:14,strokeDasharray:`${dash} ${circ-dash}`,style:{strokeDashoffset:offPx}});
        offset+=d.value;return el;
      })
    ),
    React.createElement('div',{className:"donut-legend"},
      data.map((d,i)=>React.createElement('div',{key:i,className:"legend-item"},
        React.createElement('span',{className:"legend-dot",style:{background:d.color}}),
        React.createElement('span',{style:{color:"var(--text-muted)",flex:1}},d.label),
        React.createElement('span',{style:{fontWeight:700,color:"var(--text)"}},d.value)
      ))
    )
  );
};

const BarChart=({data})=>{
  const max=Math.max(...data.map(d=>d.value),1);
  return React.createElement('div',null,
    data.map((d,i)=>React.createElement('div',{key:i,className:"chart-bar-item"},
      React.createElement('span',{className:"chart-bar-label"},d.label),
      React.createElement('div',{className:"chart-bar-track"},
        React.createElement('div',{className:"chart-bar-fill",style:{width:`${(d.value/max)*100}%`,background:d.color||"var(--accent)"}})
      ),
      React.createElement('span',{className:"chart-bar-value"},d.value)
    ))
  );
};

// ===== LOGIN =====
function LoginPage({users,onLogin}){
  const [u,setU]=useState('');const [p,setP]=useState('');const [err,setErr]=useState('');
  const go=()=>{
    const user=users.find(x=>x.username===u&&x.password===p);
    if(user)onLogin(user);else setErr("اسم المستخدم أو كلمة المرور غير صحيحة");
  };
  return React.createElement('div',{className:"login-page"},
    React.createElement('div',{className:"login-card"},
      React.createElement('div',{style:{textAlign:"center",marginBottom:32}},
        React.createElement('div',{className:"login-logo-icon"},"AK"),
        React.createElement('h1',{style:{fontSize:28,fontWeight:900,color:"var(--text)"}},"AK CRM"),
        React.createElement('p',{style:{fontSize:14,color:"var(--text-muted)",marginTop:4}},"نظام إدارة العقارات الاحترافي")
      ),
      err&&React.createElement('div',{className:"alert alert-danger"},"⚠️ "+err),
      React.createElement('div',{className:"form-group"},
        React.createElement('label',{className:"form-label"},"اسم المستخدم"),
        React.createElement('input',{className:"form-control",placeholder:"أدخل اسم المستخدم",value:u,onChange:e=>{setU(e.target.value);setErr('')},onKeyDown:e=>e.key==='Enter'&&go()})
      ),
      React.createElement('div',{className:"form-group"},
        React.createElement('label',{className:"form-label"},"كلمة المرور"),
        React.createElement('input',{className:"form-control",type:"password",placeholder:"أدخل كلمة المرور",value:p,onChange:e=>{setP(e.target.value);setErr('')},onKeyDown:e=>e.key==='Enter'&&go()})
      ),
      React.createElement('button',{className:"btn btn-primary",style:{width:"100%",justifyContent:"center",padding:13,fontSize:15,marginTop:8},onClick:go},"تسجيل الدخول")
    )
  );
}

// ===== DASHBOARD =====
function Dashboard({data,users,currentUser}){
  const {lands,apartments,clients,activities}=data;
  const lsd=[
    {label:"متاحة",value:lands.filter(l=>l.status==="متاحة").length,color:"#10b981"},
    {label:"محجوزة",value:lands.filter(l=>l.status==="محجوزة").length,color:"#f59e0b"},
    {label:"تم البيع",value:lands.filter(l=>l.status==="تم البيع").length,color:"#3b82f6"},
    {label:"موقوفة",value:lands.filter(l=>l.status==="موقوفة").length,color:"#ef4444"},
  ].filter(d=>d.value>0);
  const csd=[
    {label:"جديد",value:clients.filter(c=>c.status==="جديد").length,color:"#6366f1"},
    {label:"مهتم",value:clients.filter(c=>c.status==="مهتم").length,color:"#10b981"},
    {label:"تفاوض",value:clients.filter(c=>c.status==="تفاوض").length,color:"#8b5cf6"},
    {label:"تم الحجز",value:clients.filter(c=>c.status==="تم الحجز").length,color:"#3b82f6"},
  ].filter(d=>d.value>0);
  const sp=users.filter(u=>u.role==="sales"||u.role==="sales_manager").map(u=>({
    label:u.name,value:clients.filter(c=>c.salesId===u.id).length+lands.filter(l=>l.salesId===u.id).length,color:"#00c2cb"
  })).sort((a,b)=>b.value-a.value);
  const rd=[...new Set(lands.map(l=>l.region))].map(r=>({
    label:r.split(" - ")[1]||r,value:lands.filter(l=>l.region===r).length,color:"#0f2557"

  const [data,setDataState]=useState(loadData);
  const [notif,setNotif]=useState(null);
  const [usage,setUsageState]=useState(loadUsage);
  const [sessionSeconds,setSessionSeconds]=useState(0);
  const sessionStartRef=useRef(null);

  const setUsers=(fn)=>{setUsersState(p=>{const n=typeof fn==='function'?fn(p):fn;saveUsers(n);return n;});};
  const setData=(fn)=>{setDataState(p=>{const n=typeof fn==='function'?fn(p):fn;saveData(n);return n;});};
  const setUsage=(fn)=>{setUsageState(p=>{const n=typeof fn==='function'?fn(p):fn;saveUsage(n);return n;});};

  useEffect(()=>{try{localStorage.setItem('ak_dark',dark?'1':'0')}catch(e){}},[dark]);

  // ---- usage timer: track active session time per logged-in user ----
  const flushSession=()=>{
    if(!user||!sessionStartRef.current)return;
    const elapsed=Math.floor((Date.now()-sessionStartRef.current)/1000);
    if(elapsed<=0)return;
    setUsage(p=>({...p,[user.id]:(p[user.id]||0)+elapsed}));
    sessionStartRef.current=Date.now();

  useEffect(()=>{
    if(!user){sessionStartRef.current=null;setSessionSeconds(0);return;}

      setSessionSeconds(s=>s+1);
      const elapsed=Math.floor((Date.now()-sessionStartRef.current)/1000);
      if(elapsed>=20){flushSession();}
    },1000);
    const onUnload=()=>flushSession();

    return ()=>{clearInterval(tick);flushSession();window.removeEventListener('beforeunload',onUnload);};
  },[user&&user.id]);

  const showNotif=(msg,type='success')=>{setNotif({msg,type});setTimeout(()=>setNotif(null),3500);};

  ];

    notif&&React.createElement('div',{style:{position:"fixed",top:20,left:"50%",transform:"translateX(-50%)",zIndex:9999,background:notif.type==='success'?"#10b981":notif.type==='warning'?"#f59e0b":"#ef4444",color:"white",padding:"12px 24px",borderRadius:12,fontWeight:600,fontSize:14,boxShadow:"0 8px 24px rgba(0,0,0,.2)",fontFamily:"'Tajawal',sans-serif",whiteSpace:"nowrap"}},notif.msg),

        ),
        React.createElement('nav',{className:"sidebar-nav"},
          secs.map(sec=>React.createElement('div',{key:sec},
            React.createElement('div',{className:"nav-section"},sec),
            nav.filter(n=>n.sec===sec).map(item=>React.createElement('button',{key:item.id,className:"nav-item"+(page===item.id?" active":""),onClick:()=>setPage(item.id)},
